spring:
  application:
    name: pharmacy-service

  # ===== DATABASE =====
  datasource:
    url: jdbc:postgresql://localhost:5432/pharmacy_db
    username: postgres
    password: anhtuansql
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ===== REDIS =====
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # ===== CACHE =====
  cache:
    type: redis                     # dùng Redis làm cache provider
    redis:
      time-to-live: 3600000          # TTL 10 phút (ms)
      cache-null-values: false      # không cache giá trị null
      key-prefix: "pharmacy:"       # prefix key
      use-key-prefix: true

server:
  port: 8085

# Log SQL của Hibernate — để thấy rõ lần 1 có SQL, lần 2 không
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.cache: TRACE
    org.springframework.data.redis: INFO
    com.pharmacy.pharmacyservice: DEBUG